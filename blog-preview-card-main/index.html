<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <!--Fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
  <link href="./styles.css" rel="stylesheet">
  <link rel="preload" href="./assets/images/illustration-article.svg" as="image">
  <link rel="preload" href="./assets/images/image-avatar.webp" as="image">
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
      <div class="card">
        <div class="card-image">
          <img src="./assets/images/illustration-article.svg" alt="Drawers Image">
        </div>
        <div class="card-content">
            <div class="card-badge">Learning</div>
            <div class="card-date">Published 21 Dec 2023</div>
            <h1 class="card-title">HTML & CSS foundations</h1>
            <p class="card-description">
              These languages are the backbone of every website, defining structure, content, and presentation.
            </p>
        </div>
        <div class="card-footer">
            <img class="author-avatar" src="./assets/images/image-avatar.webp" alt="Greg Hooper">
            <span class="author-name">Greg Hooper</span>
        </div>
      </div>
  </main>
</body>
</html>
